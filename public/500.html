<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Something went wrong · Aalam</title>
  <style>
    /* A standalone page: it is shown when the app itself has failed, so it cannot use the site's
       stylesheet. These values mirror the site theme in app/assets/tailwind/application.css. */
    :root {
      --page: #000000;
      --panel: #141414;
      --line: #494949;
      --text: #ffffff;
      --muted: #7c7a7a;
      --accent: #ff5d73;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      background: var(--page);
      color: var(--text);
      font-family: ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    main {
      width: 100%;
      max-width: 40rem;
      padding: 3.5rem 1.5rem;
      border: 1px solid var(--line);
      background:
        radial-gradient(ellipse at top, rgba(255, 93, 115, 0.22), transparent 65%),
        var(--panel);
      text-align: center;
    }

    .eyebrow {
      margin: 0;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0.75rem 0 0;
      font-size: clamp(2.25rem, 7vw, 3.75rem);
      line-height: 1.05;
    }

    .text {
      max-width: 28rem;
      margin: 1rem auto 0;
      color: var(--muted);
      font-size: 1.125rem;
    }

    .button {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.7rem 1.5rem;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #000000;
      font-weight: 600;
      text-decoration: none;
    }

    .button:hover,
    .button:focus-visible {
      background: transparent;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Error 500</p>
    <h1>Something went wrong</h1>
    <p class="text">The problem is on our side, not yours. Please try again in a moment.</p>
    <a class="button" href="/">Back to home</a>
  </main>
</body>
</html>
